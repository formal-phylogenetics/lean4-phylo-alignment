title = "Phylogeny-aware alignment and joint statistical estimation"
priority = "high"

[[family]]
id = 5
title = "Progressive alignment and iterative refinement"
priority = "high"

[[family]]
id = 6
title = "Consistency-based, posterior-probability and graph-based alignment"
priority = "high"

[[family]]
id = 7
title = "Pairwise alignment and dynamic programming foundations"
